[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alarm-clock"
version = "0.1.0"
description = "A small alarm clock CLI"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "click>=8",
    "filelock>=3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "freezegun>=1.2",
]

[project.scripts]
alarm = "alarm_clock.cli:main"

[tool.setuptools.packages.find]
include = ["alarm_clock*"]
